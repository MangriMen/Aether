[workspace]
resolver = "2"
members = [
    "apps/desktop/",
    "packages/aether-core",
    "packages/aether-core-gen",
    "packages/aether-core-plugin-api",
    "packages/register-schema",
    "packages/register-schema-derive",
]

[workspace.package]
edition = "2024"
rust-version = "1.96.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
implicit_hasher = "allow"
unused_async = "allow"

[workspace.dependencies]
# Internal Packages
aether-core = { path = "packages/aether-core" }
register-schema = { path = "packages/register-schema" }
register-schema-derive = { path = "packages/register-schema-derive" }

# Error Handling & Logging
anyhow = "1.0.103"
log = "0.4.33"
thiserror = "2.0.18"

# Serialization & Data
chrono = { version = "0.4.45", features = ["serde"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
sqlx = { version = "0.9.0", default-features = false }
uuid = { version = "1.23.5", features = ["serde", "v4"] }

# Async & Runtime
async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["full"] }

# Tauri & Frontend Bridge
specta = { version = "=2.0.0-rc.25", features = [
    "serde_json",
    "uuid",
    "chrono",
    "semver",
] }
specta-typescript = "0.0.12"
tauri = { version = "2.11.5", features = [
    "tray-icon",
    "test",
] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Utilities
semver = "1.0.28"

[profile.release]
opt-level = 3       # Maximize runtime performance
codegen-units = 16  # Split crates into 16 chunks for parallel compilation
lto = "thin"        # Enable fast parallel Link-Time Optimization
strip = true        # Automatically strip symbols (reduces binary size)
panic = "abort"     # Remove stack unwinding code
incremental = false

# Full debuginfo made every link write gigabytes of PDB: line tables keep file:line in
# backtraces at a fraction of the size, and nobody steps through dependencies in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debuginfo, for inspecting variables in a debugger: `cargo build --profile debugging`
# or `bun run dev:debug` in apps/desktop. It builds into target/debugging, so switching to it
# does not invalidate the everyday dev build.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.debugging.package."*"]
debug = "full"
