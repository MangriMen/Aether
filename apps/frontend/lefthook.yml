pre-commit:
  parallel: true

  jobs:
    - name: frontend:types
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx}'
      run: bun run lint:types
      stage_fixed: true

    - name: frontend:eslint
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx,css}'
      run: bun run lint:code .
      stage_fixed: true

    - name: frontend:arch
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx}'
      run: bun run lint:arch
      stage_fixed: true

    - name: frontend:i18n
      root: 'apps/frontend'
      glob: '{src/shared/i18n/*.json,src/platform/bindings/*.ts}'
      run: bun x vitest run src/shared/i18n
