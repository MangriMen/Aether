pre-commit:
  parallel: true

  jobs:
    - name: frontend:types
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx}'
      run: bun run lint:types
      stage_fixed: true

    - name: frontend:oxlint
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx}'
      run: bun run lint:code

    - name: frontend:eslint
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx,css}'
      run: bun run lint:eslint
      stage_fixed: true

    - name: frontend:format
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx,css}'
      run: bun run lint:format

    - name: frontend:arch
      root: 'apps/frontend'
      glob: '**/*.{js,ts,jsx,tsx}'
      run: bun run lint:arch

    - name: frontend:unused
      root: 'apps/frontend'
      glob: ['**/*.{js,ts,jsx,tsx,css}', 'apps/frontend/package.json', 'apps/frontend/knip.jsonc']
      run: bun run lint:unused

    - name: frontend:i18n
      root: 'apps/frontend'
      glob: ['apps/frontend/src/shared/i18n/*.json', 'apps/frontend/src/platform/bindings/*.ts']
      run: bun x vitest run src/shared/i18n
