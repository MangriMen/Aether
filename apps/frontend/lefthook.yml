pre-commit:
  parallel: true

  jobs:
    - name: desktop:types
      root: 'apps/desktop'
      glob: '**/*.{js,ts,jsx,tsx}'
      run: bun run lint:types
      stage_fixed: true

    - name: desktop:eslint
      root: 'apps/desktop'
      glob: '**/*.{js,ts,jsx,tsx,css}'
      run: bun run lint:code .
      stage_fixed: true

    - name: desktop:arch
      root: 'apps/desktop'
      glob: '**/*.{js,ts,jsx,tsx}'
      run: bun run lint:arch
      stage_fixed: true

    - name: frontend:i18n
      root: 'apps/frontend'
      glob: 'src/shared/{i18n/*.json,api/bindings/*.ts}'
      run: bun x vitest run src/shared/i18n
