name: Build executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Disabled macos for now. When re-enabling, also add a step running
          # `rustup target add aarch64-apple-darwin x86_64-apple-darwin` after the Rust install.
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          # args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest' # for Intel based macs.
          # args: '--target x86_64-apple-darwin'
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          JSON_VERSION=$(jq -r .version apps/desktop/tauri.conf.json)

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            if [ "$JSON_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch! Tag is $TAG_VERSION but tauri.conf.json is $JSON_VERSION"
              exit 1
            fi
          fi

          echo "APP_VERSION=$JSON_VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog
        if: github.ref_type == 'tag'
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ steps.get_version.outputs.APP_VERSION }}
          path: ./apps/frontend/CHANGELOG.md

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # version comes from rust-toolchain.toml
      - name: install Rust
        run: rustup toolchain install

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 12
        run: .github/scripts/install-linux-deps.sh

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "aether-tauri-cache"
          workspaces: "./ -> target"

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: install cargo-about
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-about

      - name: generate third-party licenses
        run: node scripts/licenses/generate-third-party-licenses.mjs

      - name: build and publish tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('v{0}', steps.get_version.outputs.APP_VERSION) || '' }}
          releaseBody: ${{ steps.changelog_reader.outputs.changes }}
          releaseDraft: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          prerelease: false
          updaterJsonPreferNsis: true
          # a manual run has no tag and publishes no release: keep the bundles as workflow artifacts
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: ${{ matrix.args }}
