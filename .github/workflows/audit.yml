name: Audit

on:
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "scripts/licenses/deny.toml"]
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "scripts/licenses/deny.toml"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny --config scripts/licenses/deny.toml check licenses bans sources
