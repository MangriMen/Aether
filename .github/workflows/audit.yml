name: Audit

on:
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock"]
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-22.04
    # non-blocking at first
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
