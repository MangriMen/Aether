name: Audit

on:
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "scripts/licenses/deny.toml"]
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "scripts/licenses/deny.toml"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-22.04
    # non-blocking at first
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny --config scripts/licenses/deny.toml check licenses
