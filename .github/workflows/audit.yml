name: Audit

on:
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "scripts/licenses/deny.toml"]
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "scripts/licenses/deny.toml"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-22.04
    # non-blocking at first
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny --config scripts/licenses/deny.toml check licenses
