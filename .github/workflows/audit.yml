name: Audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - scripts/licenses/deny.toml
      - "**/package.json"
      - bun.lock
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - scripts/licenses/deny.toml
      - "**/package.json"
      - bun.lock
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-22.04
    # non-blocking at first
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  bun-audit:
    runs-on: ubuntu-22.04
    # non-blocking at first
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # High and critical only: the moderate ones come from dev tooling and wait for upstream.
      - name: bun audit
        run: bun audit --audit-level=high

  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny --config scripts/licenses/deny.toml check licenses
