name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.jsonc'
              - '.github/workflows/ci.yml'
            rust:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # frontend checks only; the root `bun run lint` also runs clippy, which the rust job covers
      - name: Types
        working-directory: apps/frontend
        run: bun run lint:types

      - name: Lint (oxlint)
        working-directory: apps/frontend
        run: bun run lint:code

      - name: Format (oxfmt)
        working-directory: apps/frontend
        run: bun run lint:format

      # the better-tailwindcss rule sometimes times out on its cold start on a slow runner (Atomics.wait),
      # so retry once
      - name: ESLint (rules oxlint cannot run)
        working-directory: apps/frontend
        run: bun run lint:eslint || bun run lint:eslint

      - name: Architecture (dependency-cruiser)
        working-directory: apps/frontend
        run: bun run lint:arch

      - name: Unused code (knip)
        working-directory: apps/frontend
        run: bun run lint:unused

      - name: Test
        working-directory: apps/frontend
        run: bun x vitest run

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      # version and components come from rust-toolchain.toml
      - name: Install Rust
        run: rustup toolchain install

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "aether-ci-cache"
          workspaces: "./ -> target"

      # tauri's build script only needs the frontend dist directory to exist, not a real build
      - name: Stub frontend dist
        run: mkdir -p apps/frontend/dist

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite,rustls,sqlx-toml

      - name: Create database and run migrations
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          sqlx db create
          (cd packages/aether-core && sqlx migrate run)
          (cd apps/desktop && sqlx migrate run)

      - name: cargo sqlx prepare --check
        env:
          SQLX_OFFLINE: "false"
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          (cd packages/aether-core && cargo sqlx prepare --check -- --all-targets --locked)
          (cd apps/desktop && cargo sqlx prepare --check -- --all-targets --locked)

  # single required check for branch protection: skipped jobs count as success, failed ones do not
  ci-ok:
    if: always()
    needs: [changes, frontend, rust]
    runs-on: ubuntu-22.04
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then exit 1; fi
