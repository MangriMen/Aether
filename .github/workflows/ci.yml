name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.jsonc'
              - '.github/workflows/ci.yml'
            rust:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # frontend checks only; the root `bun run lint` also runs clippy, which the rust job covers
      - name: Types
        working-directory: apps/frontend
        run: bun run lint:types

      - name: Lint (oxlint)
        working-directory: apps/frontend
        run: bun run lint:code

      - name: Format (oxfmt)
        working-directory: apps/frontend
        run: bun run lint:format

      # the better-tailwindcss worker compiles Tailwind on its first call; on a slow runner that exceeds
      # synckit's default 30s (Atomics.wait timed-out), and a retry hits the same timeout, so raise it
      - name: ESLint (rules oxlint cannot run)
        working-directory: apps/frontend
        env:
          SYNCKIT_TIMEOUT: "120000"
        run: bun run lint:eslint

      - name: Architecture (dependency-cruiser)
        working-directory: apps/frontend
        run: bun run lint:arch

      - name: Unused code (knip)
        working-directory: apps/frontend
        run: bun run lint:unused

      - name: Test
        working-directory: apps/frontend
        run: bun x vitest run

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # version and components come from rust-toolchain.toml
      - name: Install Rust
        run: rustup toolchain install

      - name: Install system dependencies
        timeout-minutes: 12
        run: .github/scripts/install-linux-deps.sh --no-install-recommends

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "aether-ci-cache"
          workspaces: "./ -> target"

      # tauri's build script only needs the frontend dist directory to exist, not a real build
      - name: Stub frontend dist
        run: mkdir -p apps/frontend/dist

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite,rustls,sqlx-toml

      - name: Create database and run migrations
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          sqlx db create
          (cd packages/aether-core && sqlx migrate run)
          (cd apps/desktop && sqlx migrate run)

      - name: cargo sqlx prepare --check
        env:
          SQLX_OFFLINE: "false"
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          (cd packages/aether-core && cargo sqlx prepare --check -- --all-targets --locked)
          (cd apps/desktop && cargo sqlx prepare --check -- --all-targets --locked)

  # single required check for branch protection: skipped jobs count as success, failed ones do not
  ci-ok:
    if: always()
    needs: [changes, frontend, rust]
    runs-on: ubuntu-22.04
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then exit 1; fi
