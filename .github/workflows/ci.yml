name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # frontend checks only; the root `bun run lint` also runs clippy, which the rust job covers
      - name: Lint and types
        working-directory: apps/frontend
        run: bun run lint

      - name: Test
        working-directory: apps/frontend
        run: bun x vitest run

  rust:
    runs-on: ubuntu-22.04
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned to rust-version)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "aether-ci-cache"
          workspaces: "./ -> target"

      # tauri's build script only needs the frontend dist directory to exist, not a real build
      - name: Stub frontend dist
        run: mkdir -p apps/frontend/dist

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite,rustls,sqlx-toml

      - name: Create database and run migrations
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          sqlx db create
          (cd packages/core/aether-core && sqlx migrate run)
          (cd apps/desktop && sqlx migrate run)

      - name: cargo sqlx prepare --check
        env:
          SQLX_OFFLINE: "false"
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          (cd packages/core/aether-core && cargo sqlx prepare --check -- --all-targets)
          (cd apps/desktop && cargo sqlx prepare --check -- --all-targets)
