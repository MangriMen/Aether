name: Cache warm

# PRs can only restore caches saved on their own ref or on main, so main has to keep the shared caches
# warm. CI no longer runs on push to main; this only rebuilds when the cached inputs change
# (or by hand) and runs no tests or lints. Caches unused for 7 days are evicted, rerun by hand then.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "bun.lock"
      - ".github/workflows/cache-warm.yml"
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Install system dependencies
        timeout-minutes: 12
        run: .github/scripts/install-linux-deps.sh --no-install-recommends

      # rust-cache skips the save when the key it restored matches, and the key does not cover
      # this workflow, so a manual run or a changed step would keep the stale cache; drop it first
      - name: Drop the cache this run replaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --ref refs/heads/main --key v0-rust-aether-ci-cache --json id --jq ".[].id" |
            xargs -r -n1 gh cache delete

      # same key and workspaces as the rust job in ci.yml
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "aether-ci-cache"
          workspaces: "./ -> target"

      - name: Stub frontend dist
        run: mkdir -p apps/frontend/dist

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: cargo test (build only)
        run: cargo test --locked --workspace --no-run

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite,rustls,sqlx-toml

      # CI's `sqlx prepare --check` builds the crates per package with its own env, which produces
      # artifacts the steps above do not; run the same commands so they land in the shared cache
      - name: Create database and run migrations
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          sqlx db create
          (cd packages/aether-core && sqlx migrate run)
          (cd apps/desktop && sqlx migrate run)

      - name: cargo sqlx prepare --check
        env:
          SQLX_OFFLINE: "false"
        run: |
          export DATABASE_URL="sqlite://$GITHUB_WORKSPACE/ci.db"
          (cd packages/aether-core && cargo sqlx prepare --check -- --all-targets --locked)
          (cd apps/desktop && cargo sqlx prepare --check -- --all-targets --locked)

  bun:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # same key as the frontend job in ci.yml
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  # every run saves a cache under a new key; the old ones would sit until the repo limit evicts
  # them, possibly the live one. The rust cache is saved in the job's post step, so prune after it.
  prune:
    needs: [rust, bun]
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for prefix in v0-rust-aether-ci-cache bun-Linux; do
            gh cache list --ref refs/heads/main --key "$prefix" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
              xargs -r -n1 gh cache delete
          done
