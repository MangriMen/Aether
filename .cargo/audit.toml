[advisories]
# `zip` 4.x comes through `tauri-plugin-updater` (also in its 3.0 alpha), which extracts the
# update archive. These advisories need a malicious archive, and the updater verifies the
# minisign signature of the download before extracting it, so only an archive signed with our
# release key reaches `zip`. Drop these once the plugin moves to `zip` >= 9.
ignore = [
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
